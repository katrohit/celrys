name: Deploy MillionSend

on:
  workflow_dispatch:
    inputs:
      image_update:
        description: Pull the current MillionSend image before restarting
        required: true
        default: true
        type: boolean
      reason:
        description: Deployment or maintenance reason
        required: true
        default: Routine deployment

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-celrys-prod
  VM_NAME: vm-celrys-prod-millionsend
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    name: Refresh secrets and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate runtime configuration script
        run: bash -n infra/celrys-sync-secrets.sh
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run deployment on VM
        run: |
          CADDYFILE_B64="$(base64 -w0 infra/Caddyfile)"
          KEY_VAULT_NAME="$(az keyvault list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
          SECRETS_SCRIPT_B64="$(sed "s/__KEY_VAULT_NAME__/$KEY_VAULT_NAME/g" infra/celrys-sync-secrets.sh | base64 -w0)"
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              # Azure Run Command invokes inline scripts with /bin/sh.
              set -eu
              printf '%s' '$CADDYFILE_B64' | base64 -d > /opt/millionsend/Caddyfile
              printf '%s' '$SECRETS_SCRIPT_B64' | base64 -d > /usr/local/bin/celrys-sync-secrets
              chmod 700 /usr/local/bin/celrys-sync-secrets
              docker compose -f /opt/millionsend/compose.yaml --project-directory /opt/millionsend pull
              /usr/local/bin/celrys-sync-secrets
              docker image prune -f
              docker compose -f /opt/millionsend/compose.yaml --project-directory /opt/millionsend ps
              docker compose -f /opt/millionsend/compose.yaml --project-directory /opt/millionsend ps --status running --services | grep -x caddy
              docker compose -f /opt/millionsend/compose.yaml --project-directory /opt/millionsend ps --status running --services | grep -x millionsend
            " \
            --output json > run-command-result.json
          jq -r ".value[].message" run-command-result.json
